<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Porsche | The Art of Performance</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <header class="navbar">
        <div class="logo">PORSCHE</div>

       <nav>
    <a href="index.html">Home</a>
    <a href="models.html">Models</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
</nav>
    </header>


    <main>

        <!-- HERO SECTION -->
        <section id="home" class="hero">

            <!-- LEFT SIDE -->
            <div class="hero-content">

                <p class="eyebrow">
                    THE ART OF PERFORMANCE
                </p>

                <h1>
                    Driven by<br>
                    <span>Dreams.</span>
                </h1>

                <p class="description">
                    Discover the world of Porsche — where timeless design,
                    extraordinary performance and innovation meet.
                </p>

                <a href="#models" class="explore-btn">
                    Explore Models
                    <span>→</span>
                </a>

            </div>


            <!-- RIGHT SIDE -->
            <div class="hero-car">

                <div class="car-glow"></div>

                <div class="car-scene">

                    <div class="rotating-car">

                        <!-- Porsche body -->
                        <div class="car-body">

                            <div class="car-roof"></div>

                            <div class="car-window front-window"></div>

                            <div class="car-window back-window"></div>

                            <div class="car-headlight left-light"></div>

                            <div class="car-headlight right-light"></div>

                            <div class="car-door-line"></div>

                            <div class="car-side-line"></div>

                            <div class="car-wheel front-wheel">
                                <div class="wheel-center"></div>
                            </div>

                            <div class="car-wheel back-wheel">
                                <div class="wheel-center"></div>
                            </div>

                            <div class="car-shadow"></div>

                        </div>

                    </div>

                </div>

                <div class="car-name">
                    PORSCHE 911
                </div>

            </div>

        </section>


        <!-- INTRO SECTION -->
        <section class="intro">

            <p>ENGINEERED FOR EMOTION</p>

            <h2>
                Performance without compromise.
            </h2>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
